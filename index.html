<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Plant Survey</title>
<script>
  // Always jump to app.html with a brand-new, never-seen-before address.
  // Browsers can never have a stale copy saved under an address they've
  // never visited, so this guarantees everyone always gets the latest
  // version of the real app — no cache, no waiting, no private tabs needed.
  location.replace('app.html?v=' + Date.now());
</script>
<meta http-equiv="refresh" content="0; url=app.html" />
</head>
<body style="font-family:sans-serif;background:#ecebe6;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;color:#1b1f24;">
